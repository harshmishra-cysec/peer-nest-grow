spring.application.name=skillnest
server.port=8080

# Local secrets stay out of git. Copy application-local.properties.example
# to application-local.properties, or set the same keys as environment variables.
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/skillnest}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Used later for JWT signing. Never commit the real value.
jwt.secret=${JWT_SECRET}
